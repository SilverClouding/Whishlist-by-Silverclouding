# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5d4d86dbd557ce786f37d069c7a88aa2"
application_url = "https://whishlist-by-silverclouding.vercel.app/"
embedded = true
name = "Whislist by Silverclouding"

[access_scopes]
scopes = "read_orders,read_themes"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://whishlist-by-silverclouding.vercel.app/auth/callback" ]

[app_proxy]
url = "https://whishlist-by-silverclouding.vercel.app/apps/silverclouding-wishlist"
subpath = "silverclouding-wishlist"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
